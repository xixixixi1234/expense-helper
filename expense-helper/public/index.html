<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ExpenseHelper - Login</title>
<style>
  :root { --blue:#2563eb; --blue-dark:#1d4ed8; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f1f5f9; color:var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .box { background:#fff; border:1px solid var(--border); border-radius:16px; padding:40px; width:380px; text-align:center; }
  .logo { width:56px; height:56px; border-radius:14px; background:var(--blue); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
  h1 { font-size:22px; margin-bottom:4px; }
  p { color:var(--muted); font-size:14px; margin-bottom:24px; }
  input { width:100%; border:1px solid var(--border); border-radius:10px; padding:14px 16px; font-size:16px; outline:none; margin-bottom:14px; }
  input:focus { border-color:var(--blue); }
  button { width:100%; border:none; border-radius:10px; background:var(--blue); color:#fff; padding:14px; font-size:16px; font-weight:600; cursor:pointer; }
  button:hover { background:var(--blue-dark); }
  .err { color:#dc2626; font-size:13px; min-height:18px; margin-top:8px; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1"/><path d="M8 14h.01"/><path d="M16 14h.01"/><path d="M9 18h6"/></svg></div>
    <h1>ExpenseHelper</h1>
    <p>Please enter your participant ID to begin</p>
    <input id="pid" placeholder="Participant ID" autocomplete="off" />
    <button id="go">Enter</button>
    <div class="err" id="err"></div>
  </div>
<script>
  function submit() {
    var pid = document.getElementById("pid").value.trim();
    if (!pid) { document.getElementById("err").textContent = "Please enter an ID."; return; }
    fetch("/api/login", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({pid:pid}) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.ok) { sessionStorage.setItem("pid", d.pid); location.href = "/experiment"; }
        else { document.getElementById("err").textContent = d.error || "Login failed."; }
      })
      .catch(function(){ document.getElementById("err").textContent = "Network error."; });
  }
  document.getElementById("go").onclick = submit;
  document.getElementById("pid").addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
</script>
</body>
</html>
